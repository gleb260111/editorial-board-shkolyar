<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Редколлегия Школяр 2121</title>
    <link rel="icon" type="image/png" href="./assets/logo-CMISrYlc.png">
  <script type="module" crossorigin src="./assets/auth-BFDCZzLT.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/firebase-init-BcDGRJEx.js">
  <link rel="stylesheet" crossorigin href="./assets/firebase-init-DToKQC5F.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="auth-nav-link">← На главную</a>
        <div class="theme-switch-wrapper">
            <label for="theme-toggle-input" class="theme">
                <span class="theme__toggle-wrap">
                    <input id="theme-toggle-input" class="theme__toggle" type="checkbox" role="switch" name="theme" value="light">
                    <span class="theme__icon">
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                        <span class="theme__icon-part"></span>
                    </span>
                </span>
            </label>
        </div>
        <section id="auth-section">
            <form id="login-form">
                <h2>Вход в аккаунт</h2>
                <div class="form-group"><label for="login-email">Email</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label for="login-password">Пароль</label><input type="password" id="login-password" required></div>
                <button type="submit" class="btn">Войти</button>
                <div class="auth-toggle">Нет аккаунта? <a id="show-register-form">Зарегистрироваться</a></div>
            </form>
            <form id="register-form" class="hidden">
                <h2>Создание аккаунта</h2>
                <div class="form-group"><label for="register-surname">Фамилия</label><input type="text" id="register-surname" required></div>
                <div class="form-group"><label for="register-name">Имя</label><input type="text" id="register-name" required></div>
                <div class="form-group"><label for="register-class">Класс (например, 9Б)</label><input type="text" id="register-class" required></div>
                <div class="form-group"><label for="register-email">Email</label><input type="email" id="register-email" required></div>
                <div class="form-group"><label for="register-password">Пароль (минимум 6 символов)</label><input type="password" id="register-password" required></div>
                <button type="submit" class="btn">Создать аккаунт</button>
                <div class="auth-toggle">Уже есть аккаунт? <a id="show-login-form">Войти</a></div>
            </form>
        </section>
    </div>
    <div id="notification-container"></div>
    <div class="loader-overlay" id="loader-overlay">
        <div class="spinner">
          <div></div><div></div><div></div><div></div><div></div>
        </div>
    </div>
</body>
</html>
