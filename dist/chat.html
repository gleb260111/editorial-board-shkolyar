<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общий чат - Школяр 2121</title>
    <link rel="icon" type="image/png" href="./assets/logo-1co98nRr.png">
  <script type="module" crossorigin src="./assets/chat-DzrMuGsK.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/firebase-init-CROYP5xz.js">
  <link rel="stylesheet" crossorigin href="./assets/firebase-init-RKNvZBJo.css">
</head>
<body>
    <body class="dashboard-bg"></body>
    <div class="container chat-container-layout">
        <header>
            <div class="header-left">
                <h1 style="color: var(--accent-color);">💬 Общий чат</h1>
            </div>

            <a href="menu.html" class="burger-btn"></a>

            <div class="nav-menu">
                <div class="theme-switch-wrapper">
                    <label class="theme">
                        <span class="theme__toggle-wrap">
                            <input class="theme__toggle" type="checkbox" role="switch" name="theme" value="light">
                        </span>
                    </label>
                </div>
                <a href="dashboard.html" class="btn-link btn-secondary" style="margin: 0 10px;">Кабинет</a>
                <a href="feed.html" class="btn-link btn-secondary" style="margin-right: 10px;">Лента</a>
            </div>
        </header>
        
        <main class="chat-wrapper">
            <div id="chat-messages" class="chat-messages">
                <div class="loader-placeholder">Загрузка сообщений...</div>
            </div>
            
            <div class="chat-input-container">
                <textarea id="chat-input" placeholder="Написать сообщение..." rows="1" maxlength="2000"></textarea>
                <button id="btn-send-msg" class="btn">🚀</button>
            </div>
        </main>
    </div>

    <div id="edit-msg-modal" class="hidden overlay-center">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">Редактировать сообщение</h3>
            <textarea id="edit-msg-input" style="width:100%; height:100px; padding:10px; background:var(--input-bg); color:var(--primary-text-color); border:1px solid var(--border-color); border-radius:8px; resize:none;"></textarea>
            <div class="form-actions" style="margin-top: 15px;">
                <button class="btn" id="save-edit-btn">Сохранить</button>
                <button class="btn btn-secondary" id="cancel-edit-btn">Отмена</button>
            </div>
        </div>
    </div>

    <div id="dossier-modal" class="hidden overlay-center">
        <div class="modal-content" style="max-width: 400px;">
            <div id="dossier-content">
            </div>
            <button class="btn btn-secondary" onclick="document.getElementById('dossier-modal').classList.add('hidden')" style="width:100%; margin-top:15px;">Закрыть</button>
        </div>
    </div>

    <div id="notification-container"></div>
    <div class="loader-overlay" id="loader-overlay">
        <div class="spinner"><div></div><div></div><div></div><div></div><div></div></div>
    </div>

</body>
</html>
